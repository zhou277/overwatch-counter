<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>守望先锋英雄克制查询 v2.5</title>
<style>
:root{
  --bg:#0f1219; --panel:#181d27; --panel2:#202735; --text:#edf2f7;
  --muted:#95a1b3; --accent:#f99e1a; --good:#40c781; --bad:#ff657a; --line:#30394a;
}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(135deg,#0c1017,#151b26);color:var(--text);
font-family:Inter,"Microsoft YaHei",system-ui,sans-serif;min-height:100vh}
.app{max-width:1120px;margin:auto;padding:28px 18px 48px}
header{display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap}
h1{margin:0;font-size:28px}
.subtitle{color:var(--muted);margin-top:6px;font-size:14px}
.search{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0 16px}
input,select{background:#111722;border:1px solid var(--line);color:white;border-radius:10px;
padding:11px 13px;font-size:14px;outline:none}
input{flex:1;min-width:230px}
select{min-width:140px}
.layout{display:grid;grid-template-columns:300px 1fr;gap:18px}
.hero-list,.detail{background:rgba(24,29,39,.94);border:1px solid var(--line);border-radius:16px}
.hero-list{padding:10px;max-height:70vh;overflow:auto}
.hero-item{padding:12px;border-radius:11px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px}
.hero-item-left{display:flex;align-items:center;min-width:0}

.hero-item-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero-item{padding:12px;border-radius:11px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.hero-item:hover{background:var(--panel2)}
.hero-item.active{background:#2a3344;outline:1px solid #46536a}
.role{font-size:12px;color:var(--muted)}
.role-pill{font-size:11px;font-weight:800;padding:4px 8px;border-radius:999px;letter-spacing:.2px}
.role-tank{background:#203149;color:#8fc3ff;border:1px solid #34567e}
.role-dps{background:#432632;color:#ff9caf;border:1px solid #744052}
.role-support{background:#20392d;color:#87e7ae;border:1px solid #37604b}
.detail{padding:22px;min-height:500px}
.hero-head{display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--line);padding-bottom:17px}
.avatar{width:60px;height:60px;border-radius:14px;background:linear-gradient(135deg,#313c50,#1c2330);
display:grid;place-items:center;font-weight:800;font-size:22px;color:var(--accent);overflow:hidden;border:1px solid #42506a}

.hero-name{font-size:25px;font-weight:750}
.badge{display:inline-block;margin-top:6px;padding:3px 8px;border-radius:99px;background:#111722;color:var(--muted);font-size:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
.card{background:#121823;border:1px solid var(--line);border-radius:13px;padding:15px}
.card h3{font-size:15px;margin:0 0 12px}
.good h3{color:var(--good)} .bad h3{color:var(--bad)}
.tags{display:flex;gap:8px;flex-wrap:wrap}
.tag{background:#252e3e;border:1px solid #354157;border-radius:999px;padding:6px 10px;font-size:13px}
.note{margin-top:16px;background:#121823;border-left:4px solid var(--accent);border-radius:9px;padding:13px 14px;color:#cbd4e2;line-height:1.7}
.empty{color:var(--muted);text-align:center;padding:28px}
footer{color:#7f8a9c;font-size:12px;margin-top:16px;line-height:1.6}
.tabs{display:flex;gap:8px;margin:18px 0 4px}
.tab{border:1px solid var(--line);background:#121823;color:var(--muted);padding:9px 14px;border-radius:10px;cursor:pointer;font-weight:700}
.tab.active{color:white;border-color:#57657d;background:#273043}
.map-layout{display:none}
.map-layout.active{display:grid}
.counter-layout.hidden{display:none}
.map-list{background:rgba(24,29,39,.94);border:1px solid var(--line);border-radius:16px;padding:10px;max-height:70vh;overflow:auto}
.map-item{padding:12px;border-radius:11px;cursor:pointer}
.map-item:hover,.map-item.active{background:#2a3344}
.map-mode{font-size:11px;color:var(--muted);margin-top:4px}
.comp{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.role-sections{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}
.role-section{background:#121823;border:1px solid var(--line);border-radius:14px;padding:14px}
.role-section h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px}
.role-section.tank{border-top:3px solid #5ca8ff}
.role-section.dps{border-top:3px solid #ff6f8c}
.role-section.support{border-top:3px solid #58d68d}
.role-icon{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-size:12px;font-weight:900}
.role-section.tank .role-icon{background:#203149;color:#8fc3ff}
.role-section.dps .role-icon{background:#432632;color:#ff9caf}
.role-section.support .role-icon{background:#20392d;color:#87e7ae}
@media(max-width:900px){.role-sections{grid-template-columns:1fr}}
.comp-row{display:grid;grid-template-columns:70px 1fr;gap:10px;align-items:start}
.comp-label{color:var(--muted);font-size:13px;padding-top:5px}
.reason{color:#cbd4e2;line-height:1.75}

.matchup-title{font-size:16px;font-weight:800;margin:22px 0 10px}
.matchup-title.strong{color:var(--good)}
.matchup-title.weak{color:var(--bad)}
.matchup-roles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.matchup-role{background:#121823;border:1px solid var(--line);border-radius:13px;padding:13px}
.matchup-role h4{margin:0 0 10px;font-size:13px;color:#cbd4e2;display:flex;align-items:center;gap:7px}
.matchup-rank{display:flex;flex-direction:column;gap:7px}
.rank-item{display:flex;align-items:center;gap:8px;background:#1b2230;border-radius:9px;padding:8px 9px;font-size:13px}
.rank-num{width:20px;height:20px;border-radius:6px;background:#2c3547;display:grid;place-items:center;font-size:11px;font-weight:800;color:#dce5f2;flex:0 0 20px}
.role-dot{font-size:11px;font-weight:900;padding:2px 6px;border-radius:999px}
.role-dot.t{background:#203149;color:#8fc3ff}
.role-dot.c{background:#432632;color:#ff9caf}
.role-dot.s{background:#20392d;color:#87e7ae}
@media(max-width:850px){.matchup-roles{grid-template-columns:1fr}}

@media(max-width:760px){.layout{grid-template-columns:1fr}.hero-list{max-height:250px}.grid{grid-template-columns:1fr}}

/* v1.9 mobile optimization */
html{-webkit-text-size-adjust:100%}
body{overflow-x:hidden}
button,input,select{touch-action:manipulation}

@media(max-width:760px){
  .app{padding:14px 10px 28px}
  header{align-items:flex-start}
  h1{font-size:22px;line-height:1.25}
  .subtitle{font-size:13px;line-height:1.55}

  .tabs{
    position:sticky;
    top:0;
    z-index:20;
    margin:14px -10px 10px;
    padding:8px 10px;
    background:rgba(15,18,25,.96);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .tab{
    flex:1;
    min-height:44px;
    padding:10px 8px;
    font-size:14px;
  }

  .search{
    display:grid;
    grid-template-columns:1fr;
    gap:9px;
    margin:12px 0;
  }
  input,select{
    width:100%;
    min-width:0;
    min-height:46px;
    font-size:16px;
    border-radius:12px;
  }

  .layout{
    grid-template-columns:1fr;
    gap:12px;
  }
  .hero-list,.map-list{
    max-height:280px;
    border-radius:14px;
    padding:8px;
  }
  .hero-item,.map-item{
    min-height:48px;
    padding:11px 10px;
  }
  .hero-item-name{font-size:15px}
  .role-pill{
    flex:0 0 auto;
    font-size:11px;
    padding:5px 8px;
  }

  .detail{
    min-height:0;
    padding:15px 12px;
    border-radius:14px;
  }
  .hero-head{
    gap:10px;
    padding-bottom:13px;
  }
  .avatar{
    width:48px;
    height:48px;
    border-radius:12px;
    font-size:17px;
    flex:0 0 48px;
  }
  .hero-name{font-size:21px}
  .badge{font-size:11px}

  .matchup-title{
    font-size:15px;
    margin:18px 0 9px;
  }
  .matchup-roles{
    grid-template-columns:1fr;
    gap:9px;
  }
  .matchup-role{
    padding:12px;
    border-radius:12px;
  }
  .matchup-role h4{
    font-size:13px;
    margin-bottom:8px;
  }
  .rank-item{
    min-height:42px;
    padding:9px 10px;
    font-size:14px;
  }
  .rank-num{
    width:22px;
    height:22px;
    flex-basis:22px;
  }

  .role-sections{
    grid-template-columns:1fr;
    gap:10px;
  }
  .role-section{
    padding:12px;
  }

  .grid{
    grid-template-columns:1fr;
    gap:10px;
  }
  .card{
    padding:13px;
  }
  .tags{
    gap:7px;
  }
  .tag{
    padding:7px 10px;
    font-size:13px;
  }
  .note{
    margin-top:13px;
    padding:12px;
    line-height:1.7;
    font-size:13px;
  }

  .comp-row{
    grid-template-columns:1fr;
    gap:5px;
  }
  .comp-label{
    padding-top:0;
    font-weight:700;
  }

  footer{
    font-size:11px;
    margin-top:12px;
  }
}

@media(max-width:390px){
  .app{padding-left:8px;padding-right:8px}
  .tabs{margin-left:-8px;margin-right:-8px;padding-left:8px;padding-right:8px}
  h1{font-size:20px}
  .tab{font-size:13px}
  .hero-name{font-size:19px}
  .role-pill{padding:4px 7px}
  .detail{padding:13px 10px}
  .matchup-role{padding:10px}
  .rank-item{font-size:13px}
}

</style>
</head>
<body>
<div class="app">
<header>
  <div>
    <h1>守望先锋英雄克制查询</h1>
    <div class="subtitle">v2.5 · 查询英雄克制关系，也可以按地图查看推荐英雄与参考阵容</div>
  </div>
</header>

<div class="tabs">
  <button class="tab active" id="counterTab">英雄克制</button>
  <button class="tab" id="mapTab">地图推荐</button>
</div>
<div class="search" id="counterSearch">
  <input id="search" placeholder="搜索英雄，例如：毛妹 / Winston / 安娜" />
  <select id="role">
    <option value="全部">全部位置</option>
    <option value="坦克">T · 坦克</option>
    <option value="输出">C · 输出</option>
    <option value="支援">S · 辅助</option>
  </select>
</div>

<div class="layout counter-layout" id="counterLayout">
  <div class="hero-list" id="heroList"></div>
  <div class="detail" id="detail"></div>
</div>

<div class="layout map-layout" id="mapLayout">
  <div class="map-list" id="mapList"></div>
  <div class="detail" id="mapDetail"></div>
</div>

<footer>
克制关系用于快速决策，不代表绝对胜负；地图、阵容、技能交换、玩家熟练度都会明显改变对局结果。英雄对位已细分为 T / C / 辅助三个位置，每个位置分别显示克制 TOP 3 与被克制 TOP 3。当前版本已针对手机窄屏和触控操作优化。
<br>单文件发布版：页面样式、交互逻辑、英雄克制数据和地图推荐数据均已内嵌，无需额外资源文件。<br>英雄列表已重新按 T 坦克 → C 输出 → S 辅助严格分组，并自动移除重复英雄。当前共 53 名。</footer>
</div>

<script>
const heroes = [
{name:"D.Va", aliases:["dva", "d.va"], role:"坦克", strong:["温斯顿", "法老之鹰", "黑百合", "艾什"], weak:["查莉娅", "秩序之光", "美"], note:"擅长吃飞行弹道与切后排。面对查莉娅时，防御矩阵无法阻挡光束，注意不要给她白送能量。"},
{name:"末日铁拳", aliases:["doomfist", "铁拳"], role:"坦克", strong:["禅雅塔", "黑百合", "安娜"], weak:["奥丽莎", "路霸", "卡西迪", "黑影"], note:"核心是机动性与进出场节奏。硬控越多越难发挥，先逼控制技能再进场。"},
{name:"渣客女王", aliases:["junker queen", "女王"], role:"坦克", strong:["拉玛刹", "路霸"], weak:["奥丽莎", "D.Va", "安娜"], note:"近距离持续压迫强，怕被拉扯与减疗。利用掩体缩短接敌距离。"},
{name:"奥丽莎", aliases:["orisa", "奥利莎"], role:"坦克", strong:["末日铁拳", "路霸", "莱因哈特"], weak:["查莉娅", "禅雅塔", "秩序之光"], note:"强在正面抗压和打断。遇到高能查莉娅时尽量拉开并集火她的队友。"},
{name:"拉玛刹", aliases:["ramattra", "拉马刹"], role:"坦克", strong:["莱因哈特", "布丽吉塔"], weak:["路霸", "渣客女王", "堡垒"], note:"变身阶段近战压制力高。注意形态切换窗口，不要在资源不足时强行冲脸。"},
{name:"莱因哈特", aliases:["reinhardt", "大锤"], role:"坦克", strong:["查莉娅", "温斯顿"], weak:["奥丽莎", "拉玛刹", "堡垒", "法老之鹰"], note:"强依赖近距离与地图拐角。空旷图和高地多时通常更难发挥。"},
{name:"路霸", aliases:["roadhog", "猪"], role:"坦克", strong:["温斯顿", "末日铁拳", "拉玛刹"], weak:["安娜", "奥丽莎", "死神"], note:"钩中关键目标能快速形成击杀。最怕减疗与被集火，注意呼吸器使用时机。"},
{name:"西格玛", aliases:["sigma", "西格玛"], role:"坦克", strong:["堡垒", "黑百合", "艾什"], weak:["温斯顿", "查莉娅", "莱因哈特"], note:"中远距离资源交换很强，怕被贴脸和多方向切入。"},
{name:"温斯顿", aliases:["winston", "猩猩"], role:"坦克", strong:["黑百合", "源氏", "禅雅塔"], weak:["路霸", "死神", "堡垒", "D.Va"], note:"主要针对脆皮后排和高台。跳入前先确认队友能否跟伤害，否则容易白给。"},
{name:"破坏球", aliases:["wrecking ball", "ball", "仓鼠"], role:"坦克", strong:["黑百合", "禅雅塔", "安娜"], weak:["黑影", "布丽吉塔", "路霸"], note:"靠骚扰和位移制造空间。遇到大量控制时减少长时间停留。"},
{name:"查莉娅", aliases:["zarya", "毛妹"], role:"坦克", strong:["D.Va", "奥丽莎", "西格玛"], weak:["温斯顿", "莱因哈特", "高机动阵容"], note:"对依赖吸收弹道的坦克很强。护盾使用质量决定能量与生存，避免双盾一起交空。"},
{name:"D.Mon", aliases:["dmon", "d.mon", "迪蒙"], role:"坦克", strong:["温斯顿", "西格玛", "破坏球"], weak:["查莉娅", "秩序之光", "美"], note:"机甲坦克，兼具正面屏障、机动和近战压迫。面对持续光束和强控场时要谨慎交位移。"},
{name:"金驭", aliases:["domina", "多米娜"], role:"坦克", strong:["莱因哈特", "路霸", "渣客女王"], weak:["温斯顿", "D.Va", "查莉娅"], note:"硬光坦克，依靠屏障、推击和中距离压制控制正面空间。面对多方向突进或持续光束时更依赖站位。"},
{name:"骇灾", aliases:["hazard", "哈扎德"], role:"坦克", strong:["西格玛", "路霸", "渣客女王"], weak:["奥丽莎", "查莉娅", "D.Va"], note:"强突进坦克，依靠跳跃、尖刺和墙体压缩空间。遇到稳定抗冲和持续光束阵容时避免无脑进场。"},
{name:"毛加", aliases:["mauga", "毛加"], role:"坦克", strong:["温斯顿", "路霸", "莱因哈特"], weak:["D.Va", "西格玛", "奥丽莎"], note:"持续火力和近中距离压迫很强，适合正面对拼大体型目标。面对减疗、矩阵和远程消耗时减少长时间站桩。"},
{name:"艾什", aliases:["ashe"], role:"输出", strong:["死神", "美", "托比昂"], weak:["温斯顿", "D.Va", "源氏", "黑百合"], note:"中远距离压制优秀，怕强突脸。站位要给自己留撤退路线。"},
{name:"堡垒", aliases:["bastion"], role:"输出", strong:["温斯顿", "莱因哈特", "路霸"], weak:["源氏", "西格玛", "黑百合"], note:"爆发火力高，但体型大、技能窗口明显。尽量跟坦克资源同步。"},
{name:"卡西迪", aliases:["cassidy", "麦克雷"], role:"输出", strong:["源氏", "猎空", "末日铁拳"], weak:["黑百合", "艾什", "西格玛"], note:"中近距离稳定，磁性手雷/控制类技能能限制高机动英雄。"},
{name:"源氏", aliases:["genji"], role:"输出", strong:["黑百合", "安娜", "禅雅塔"], weak:["温斯顿", "查莉娅", "莫伊拉", "秩序之光"], note:"适合切脆皮和收割残血。面对光束英雄时，弹反价值会明显下降。"},
{name:"半藏", aliases:["hanzo"], role:"输出", strong:["堡垒", "路霸", "托比昂"], weak:["温斯顿", "D.Va", "源氏"], note:"有高爆发和探测能力，但被贴脸后容错下降。"},
{name:"狂鼠", aliases:["junkrat"], role:"输出", strong:["莱因哈特", "奥丽莎", "布丽吉塔"], weak:["法老之鹰", "艾什", "黑百合"], note:"狭窄地形强，空中与远距离目标难处理。"},
{name:"美", aliases:["mei"], role:"输出", strong:["D.Va", "莱因哈特", "源氏"], weak:["法老之鹰", "艾什", "黑百合"], note:"擅长分割阵型和减速近战目标。远距离压力相对有限。"},
{name:"法老之鹰", aliases:["pharah", "法拉"], role:"输出", strong:["莱因哈特", "狂鼠", "美"], weak:["艾什", "黑百合", "士兵：76", "D.Va"], note:"利用高空角度绕盾输出。对面双长枪时更依赖掩体和天使资源。"},
{name:"死神", aliases:["reaper"], role:"输出", strong:["温斯顿", "路霸", "莱因哈特"], weak:["艾什", "黑百合", "法老之鹰"], note:"近距离对大体型目标伤害很高，核心是利用传送/幽灵形态接近并安全撤出。"},

let selected = heroes[0];

function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}


function matches(h,q){
  q=q.trim().toLowerCase();
  if(!q) return true;
  return h.name.toLowerCase().includes(q) || h.aliases.some(a=>a.toLowerCase().includes(q));
}

function renderList(){
  const q=document.getElementById("search").value;
  const role=document.getElementById("role").value;
  const list=heroes.filter(h=>matches(h,q)&&(role==="全部"||h.role===role));
  const root=document.getElementById("heroList");
  if(!list.length){root.innerHTML='<div class="empty">没有找到英雄</div>';return;}
  root.innerHTML=list.map((h,i)=>`
    <div class="hero-item ${selected&&selected.name===h.name?'active':''}" data-name="${esc(h.name)}">
      <div class="hero-item-left">
        <span class="hero-item-name">${esc(h.name)}</span>
      </div>
      <span class="role-pill ${h.role==="坦克"?"role-tank":h.role==="输出"?"role-dps":"role-support"}">${h.role==="坦克"?"T 坦克":h.role==="输出"?"C 输出":"S 辅助"}</span>
    </div>`).join("");
  root.querySelectorAll(".hero-item").forEach(el=>{
    el.onclick=()=>{selected=heroes.find(h=>h.name===el.dataset.name);renderList();renderDetail();}
  });
}

function renderDetail(){
  const h=selected;
  const root=document.getElementById("detail");
  if(!h){root.innerHTML='<div class="empty">请选择一个英雄</div>';return;}

  const roleMeta={
    "坦克":{label:"T · 坦克", cls:"t"},
    "输出":{label:"C · 输出", cls:"c"},
    "支援":{label:"S · 辅助", cls:"s"}
  };

  function roleBlock(direction, role){
    const list=(matchupData[h.name]&&matchupData[h.name][direction]&&matchupData[h.name][direction][role])||[];
    const meta=roleMeta[role];
    return `<div class="matchup-role">
      <h4><span class="role-dot ${meta.cls}">${role==="坦克"?"T":role==="输出"?"C":"S"}</span>${meta.label} TOP 3</h4>
      <div class="matchup-rank">
        ${list.map((x,i)=>`<div class="rank-item"><span class="rank-num">${i+1}</span><span>${esc(x)}</span></div>`).join("")}
      </div>
    </div>`;
  }

  root.innerHTML=`
    <div class="hero-head">
      <div class="avatar">${h.role==="坦克"?"T":h.role==="输出"?"C":"S"}</div>
      <div>
        <div class="hero-name">${esc(h.name)}</div>
        <div class="badge">${h.role==="坦克"?"T · 坦克":h.role==="输出"?"C · 输出":"S · 辅助"}</div>
      </div>
    </div>

    <div class="matchup-title weak">⚠ 谁比较克制我</div>
    <div class="matchup-roles">
      ${roleBlock("weak","坦克")}
      ${roleBlock("weak","输出")}
      ${roleBlock("weak","支援")}
    </div>

    <div class="matchup-title strong">✓ 我比较克制谁</div>
    <div class="matchup-roles">
      ${roleBlock("strong","坦克")}
      ${roleBlock("strong","输出")}
      ${roleBlock("strong","支援")}
    </div>

    <div class="note"><b>对局提示：</b>${esc(h.note)}</div>
  `;
}

document.getElementById("search").addEventListener("input",renderList);
document.getElementById("role").addEventListener("change",renderList);
renderList(); renderDetail();

let selectedMap = maps[0];

function renderMaps(){
  const root=document.getElementById("mapList");
  root.innerHTML=maps.map(m=>`
    <div class="map-item ${selectedMap.name===m.name?'active':''}" data-map="${esc(m.name)}">
      <div>${esc(m.name)}</div>
      <div class="map-mode">${esc(m.mode)} · ${esc(m.style)}</div>
    </div>`).join("");
  root.querySelectorAll(".map-item").forEach(el=>{
    el.onclick=()=>{selectedMap=maps.find(m=>m.name===el.dataset.map);renderMaps();renderMapDetail();}
  });
}

function renderMapDetail(){
  const m=selectedMap;
  const tags=a=>a.map(x=>`<span class="tag">${esc(x)}</span>`).join("");
  document.getElementById("mapDetail").innerHTML=`
    <div class="hero-head">
      <div class="avatar">图</div>
      <div><div class="hero-name">${esc(m.name)}</div><div class="badge">${esc(m.mode)} · ${esc(m.style)}</div></div>
    </div>

    <div class="role-sections">
      <div class="role-section tank">
        <h3><span class="role-icon">T</span> 坦克推荐</h3>
        <div class="tags">${tags(m.tank)}</div>
      </div>

      <div class="role-section dps">
        <h3><span class="role-icon">C</span> 输出推荐</h3>
        <div class="tags">${tags(m.dps)}</div>
      </div>

      <div class="role-section support">
        <h3><span class="role-icon">S</span> 辅助推荐</h3>
        <div class="tags">${tags(m.support)}</div>
      </div>
    </div>

    <div class="card" style="margin-top:14px">
      <h3>参考阵容</h3>
      <div class="reason">${esc(m.comp)}</div>
    </div>

    <div class="note"><b>为什么适合：</b>${esc(m.reason)}</div>
  `;
}

function setTab(tab){
  const counter = tab==="counter";
  document.getElementById("counterTab").classList.toggle("active",counter);
  document.getElementById("mapTab").classList.toggle("active",!counter);
  document.getElementById("counterLayout").classList.toggle("hidden",!counter);
  document.getElementById("counterSearch").style.display=counter?"flex":"none";
  document.getElementById("mapLayout").classList.toggle("active",!counter);
}
document.getElementById("counterTab").onclick=()=>setTab("counter");
document.getElementById("mapTab").onclick=()=>setTab("map");
renderMaps(); renderMapDetail();
